plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.reminder'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.reminder"
        minSdk 33
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def keystorePropertiesFile = rootProject.file("keystore.properties")
            if (!keystorePropertiesFile.exists()) {
                keystorePropertiesFile = file("../keystore.properties")
            }
            if (!keystorePropertiesFile.exists()) {
                keystorePropertiesFile = file("keystore.properties")
            }

            def keystoreProperties = new Properties()
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
            }

            def storeFilePath = keystoreProperties['storeFile'] ?: System.getenv('RELEASE_STORE_FILE')
            def storePasswordVal = keystoreProperties['storePassword'] ?: System.getenv('RELEASE_STORE_PASSWORD')
            def keyAliasVal = keystoreProperties['keyAlias'] ?: System.getenv('RELEASE_KEY_ALIAS')
            def keyPasswordVal = keystoreProperties['keyPassword'] ?: System.getenv('RELEASE_KEY_PASSWORD') ?: storePasswordVal

            if (storeFilePath && file(storeFilePath).exists() && storePasswordVal && keyAliasVal && keyPasswordVal) {
                storeFile file(storeFilePath)
                storePassword storePasswordVal
                keyAlias keyAliasVal
                keyPassword keyPasswordVal
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each {
            it.outputFileName.set("reminder.apk")
        }
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.6.1'  // downgrade from 1.7.1
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'com.google.android.material:material:1.12.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    // Retrofit + OkHttp + Gson
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // EncryptedSharedPreferences
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // WorkManager for background sync retries
    implementation 'androidx.work:work-runtime:2.9.0'
}
